<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#235b46" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>家庭位置 · 彼此安心</title>
    <link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/styles.css" />
    <script type="module" src="/assets/family.mjs"></script>
  </head>
  <body>
    <div class="shell">
      <header class="header">
        <div class="brand">
          <img src="/assets/icon.svg" alt="" width="38" height="38" /><span
            >家人位置<small>彼此安心，自在出发</small></span
          >
        </div>
      </header>
      <main>
        <section id="loading" class="loading" role="status">
          正在验证家庭访问…
        </section>
        <section id="family-invalid" class="empty-state" hidden>
          <h1>家庭链接不可用</h1>
          <p>链接无效或家庭已删除，请联系分享链接的家人。</p>
        </section>
        <section id="family-auth" class="viewer-auth" hidden>
          <form id="family-auth-form" class="login-card">
            <span class="section-number">WELCOME HOME</span>
            <h1>看看家人在哪里</h1>
            <p class="muted">
              输入家人分享的 7 位数字口令。同一浏览器验证后 7 天内免输入。
            </p>
            <label for="family-passcode">家庭口令</label
            ><input
              id="family-passcode"
              name="passcode"
              type="password"
              inputmode="numeric"
              pattern="[0-9]{7}"
              minlength="7"
              maxlength="7"
              autocomplete="off"
              required
              placeholder="7 位数字"
            />
            <p
              id="family-auth-error"
              class="message error"
              role="alert"
              hidden
            ></p>
            <button id="family-auth-submit" class="primary" type="submit">
              查看家庭位置
            </button>
            <button id="retry-session" class="text-button" type="button">
              重试访问
            </button>
          </form>
        </section>
        <section id="family-view" hidden>
          <div class="page-title">
            <div>
              <p class="eyebrow">A LITTLE CLOSER</p>
              <h1 id="family-name"></h1>
              <p id="sync-status" class="muted" role="status"></p>
            </div>
            <div class="viewer-actions">
              <button id="refresh" class="secondary" type="button">刷新</button
              ><button id="family-logout" class="text-button" type="button">
                退出此家庭
              </button>
            </div>
          </div>
          <p id="viewer-message" class="message" role="status" hidden></p>
          <div class="location-layout">
            <section class="map-card" aria-label="家人地图">
              <div class="map-toolbar">
                <span><i class="small-dot"></i> 最新位置</span
                ><button
                  id="fit-map"
                  class="text-button"
                  type="button"
                  disabled
                >
                  查看全部
                </button>
              </div>
              <div class="map-surface">
                <div id="map" aria-label="高德地图"></div>
                <div id="map-fallback" class="map-fallback" role="status">
                  <img src="/assets/icon.svg" alt="" width="60" height="60" />
                  <h2 id="map-title">地图准备中</h2>
                  <p id="map-description">位置和设备信息会在下方展示</p>
                </div>
              </div>
              <div class="map-caption">
                <span>只看最新位置，不记录轨迹</span
                ><span>家人主动开启共享后可见</span>
              </div>
            </section>
            <section class="family-panel">
              <div class="section-heading">
                <h2>我的家人</h2>
                <span id="sharing-count" class="muted">0 台设备有位置</span>
              </div>
              <div id="family-list" class="family-list"></div>
              <div id="family-empty" class="empty-state">
                <span class="empty-mark" aria-hidden="true">⌁</span>
                <h3>等一个安心的消息</h3>
                <p>
                  暂时没有可查看的位置。<br />家人主动开启共享后，会在这里展示。
                </p>
              </div>
              <p class="footnote">
                定位时间反映位置的新鲜度，网络恢复后的上传可能仍是旧位置。
              </p>
            </section>
          </div>
        </section>
      </main>
      <footer>只看最新位置，不记录轨迹。<span>家人位置</span></footer>
    </div>
    <noscript
      ><p class="message">请启用 JavaScript 后查看家人位置。</p></noscript
    >
  </body>
</html>
